# Production stack for the VPS. Pulls prebuilt images from GHCR (built and
# pushed by .github/workflows/deploy.yml) — it never builds anything.
#
# Only Caddy publishes ports (80/443). Every other service is reachable
# only on the internal Compose network. TLS is terminated by Caddy with an
# automatic Let's Encrypt certificate for the domain in ./Caddyfile.
#
#   cp .env.prod.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --wait
#
# Deploys go through scripts/deploy.sh (run on the VPS by the workflow).

name: tonalys

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies pending Prisma migrations, then exits. `nest` waits
  # for it to complete successfully before starting.
  migrate:
    image: ghcr.io/melchimaelran/tonalys-nest:${IMAGE_TAG:-latest}
    restart: "no"
    working_dir: /repo/apps/nest
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  nest:
    image: ghcr.io/melchimaelran/tonalys-nest:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      TRACK_RETENTION_HOURS: ${TRACK_RETENTION_HOURS:-24}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: tracks
      WORKER_URL: http://worker:8000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  next:
    image: ghcr.io/melchimaelran/tonalys-next:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEST_API_URL: http://nest:3001
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
    healthcheck:
      # /about is public and statically rendered in every auth mode — a
      # plain 200. Hitting / instead follows the proxy redirect to the
      # (currently non-existent) /login and 404s. See .env.prod.example.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/about"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      nest:
        condition: service_healthy

  worker:
    image: ghcr.io/melchimaelran/tonalys-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: tracks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      next:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  caddy_data:
  caddy_config:
