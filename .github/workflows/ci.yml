name: CI

# On main, the same checks run as the `checks` job of deploy.yml (which
# then builds + deploys), so main is intentionally not triggered here.
on:
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nest exec prisma generate
      - run: pnpm exec turbo run lint
      - run: pnpm exec turbo run typecheck
      - run: pnpm exec turbo run test
